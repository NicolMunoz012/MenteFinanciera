<div class="dashboard">

  <app-navbar></app-navbar>

  <main class="main">

    <app-topbar title="Alertas de Gasto-Hormiga"></app-topbar>

    <div class="content">

      <section class="card alerts-page-card" aria-labelledby="alerts-title">
        <div class="alerts-page-card__header">
          <h2 class="card__title" id="alerts-title">Todas tus alertas</h2>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--red)" aria-hidden="true">
            <path d="M9.00011 5.99976V9M9.00011 12.0002H9.00761M16.5007 9C16.5007 13.1425 13.1426 16.5006 9.00011 16.5006C4.85764 16.5006 1.49951 13.1425 1.49951 9C1.49951 4.85754 4.85764 1.4994 9.00011 1.4994C13.1426 1.4994 16.5007 4.85754 16.5007 9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <p class="empty-state" *ngIf="!alerts().length">No tienes alertas por ahora. ¡Buen trabajo!</p>

        <ul class="alert-page-list" *ngIf="alerts().length">
          <li class="alert-page-item" *ngFor="let alert of alerts()">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--red)" aria-hidden="true">
              <path d="M4.5 9L7.5 6L4.5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="alert-page-item__body">
              <p class="alert-page-item__text">{{ alert.text }}</p>
              <p class="alert-page-item__time">{{ alert.tag }}</p>
            </div>
            <button class="btn-secondary" type="button" (click)="dismiss(alert.id)">Descartar</button>
          </li>
        </ul>
      </section>

    </div>
  </main>
</div>

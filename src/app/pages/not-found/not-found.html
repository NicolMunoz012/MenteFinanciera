<main class="not-found">
  <section class="card not-found__card" aria-labelledby="not-found-title">
    <p class="not-found__brand">Mente <span class="not-found__brand-accent">Financiera</span></p>
    <p class="not-found__code" aria-hidden="true">404</p>
    <h1 class="not-found__title" id="not-found-title">Esta página no existe</h1>
    <p class="not-found__text">
      Puede que el enlace haya cambiado o que la dirección esté mal escrita.
    </p>
    <a class="btn-primary" [routerLink]="homeRoute()">{{ homeLabel() }}</a>
  </section>
</main>

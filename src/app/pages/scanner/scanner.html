<div class="dashboard">

  <app-navbar></app-navbar>

  <main class="main">

    <app-topbar title="Escáner de Recibos"></app-topbar>

    <div class="content">

      <section class="card dropzone" aria-label="Subir recibo">
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="48" height="48" rx="16" fill="var(--teal)"/>
          <path d="M24 32V18M24 18L18 24M24 18L30 24M14 32V33C14 33.7956 14.3161 34.5587 14.8787 35.1213C15.4413 35.6839 16.2044 36 17 36H31C31.7956 36 32.5587 35.6839 33.1213 35.1213C33.6839 34.5587 34 33.7956 34 33V32" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="dropzone__title">Sube la foto de tu recibo</p>
        <p class="dropzone__sub">Elige una imagen y confirma los datos del gasto para registrarlo</p>
        <label class="btn-primary dropzone__btn">
          Subir Recibo
          <input type="file" accept="image/*" class="dropzone__input" (change)="onFileSelected($event)">
        </label>
      </section>

      <section class="card scan-review" *ngIf="receiptPreview() as previewUrl" aria-label="Confirmar datos del recibo">
        <img class="scan-review__image" [src]="previewUrl" alt="Vista previa del recibo">
        <form class="scan-review__form" [formGroup]="receiptForm" (ngSubmit)="submit()">
          <h2 class="card__title">Confirma los datos</h2>
          <div class="form-card__fields">
            <app-form-field label="Comercio" [control]="receiptForm.controls.merchant">
              <input class="field__input" type="text" formControlName="merchant" placeholder="Ej. Supermercado">
            </app-form-field>
            <app-form-field label="Monto" [control]="receiptForm.controls.amount">
              <input class="field__input" type="number" formControlName="amount" min="0">
            </app-form-field>
            <app-form-field label="Categoría" [control]="receiptForm.controls.category">
              <select class="field__input" formControlName="category">
                <option value="" disabled>Elige una categoría</option>
                <option *ngFor="let category of categoryNames()" [value]="category">{{ category }}</option>
              </select>
            </app-form-field>
            <app-form-field label="Fecha" [control]="receiptForm.controls.date">
              <input class="field__input" type="date" formControlName="date" [max]="todayIso">
            </app-form-field>
          </div>
          <p class="form-error" *ngIf="submitError()" role="alert">{{ submitError() }}</p>
          <div class="form-card__actions">
            <button class="btn-secondary" type="button" (click)="discardReceipt()">Descartar</button>
            <button class="btn-primary" type="submit">Registrar gasto</button>
          </div>
        </form>
      </section>

      <section class="card receipts-card" aria-labelledby="receipts-title">
        <h2 class="card__title" id="receipts-title">Recibos Recientes</h2>

        <p class="empty-state" *ngIf="!receipts().length">Todavía no has escaneado ningún recibo.</p>

        <ul class="receipts-list" *ngIf="receipts().length">
          <li class="receipt" *ngFor="let receipt of receipts()">
            <div class="receipt__icon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M7.5 6.5L10.5 8L7.5 9.5V6.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="receipt__body">
              <p class="receipt__name">{{ receipt.name }}</p>
              <p class="receipt__meta">{{ receipt.date | spanishDate }} · {{ receipt.amount | cop }}</p>
            </div>
            <span class="receipt__status">Registrado</span>
          </li>
        </ul>
      </section>

    </div>
  </main>
</div>

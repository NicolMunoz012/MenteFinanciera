<div class="dashboard">

  <app-navbar></app-navbar>

  <main class="main">

    <app-topbar title="Recordatorios de Pago"></app-topbar>

    <div class="content">

      <form class="card form-card" [formGroup]="reminderForm" (ngSubmit)="submit()">
        <h2 class="card__title">Nuevo recordatorio</h2>
        <div class="form-card__fields">
          <app-form-field label="Nombre" [control]="reminderForm.controls.name">
            <input class="field__input" type="text" formControlName="name" placeholder="Ej. Gimnasio">
          </app-form-field>
          <app-form-field label="Monto" [control]="reminderForm.controls.amount">
            <input class="field__input" type="number" formControlName="amount" min="0">
          </app-form-field>
          <app-form-field label="Fecha de vencimiento" [control]="reminderForm.controls.dueDate">
            <input class="field__input" type="date" formControlName="dueDate">
          </app-form-field>
        </div>
        <div class="form-card__actions">
          <button class="btn-primary" type="submit">Agregar recordatorio</button>
        </div>
      </form>

      <section class="card reminders-card" aria-labelledby="reminders-title">
        <h2 class="card__title" id="reminders-title">Próximos Pagos</h2>

        <p class="empty-state" *ngIf="!rows().length">No tienes pagos pendientes.</p>

        <ul class="reminder-list" *ngIf="rows().length">
          <li class="reminder" *ngFor="let row of rows()" [class.reminder--paid]="row.isPaid">
            <div class="reminder__icon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2" y="3.5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M2 7.5H16M5 11.5H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="reminder__body">
              <p class="reminder__name">{{ row.name }}</p>
              <p class="reminder__meta">{{ row.amount | cop }} · {{ row.dueDate | spanishDate }}</p>
            </div>
            <span class="reminder__due" [ngClass]="dueClass(row)">{{ dueLabel(row) }}</span>
            <button class="btn-secondary" type="button" (click)="togglePaid(row.id)">
              {{ row.isPaid ? 'Marcar pendiente' : 'Marcar pagado' }}
            </button>
            <button class="btn-danger" type="button" (click)="remove(row.id)">Eliminar</button>
          </li>
        </ul>
      </section>

    </div>
  </main>
</div>

<div class="dashboard">

  <app-navbar></app-navbar>

  <main class="main">

    <app-topbar title="Análisis Financiero"></app-topbar>

    <div class="content">

      <section class="card rank-card" aria-labelledby="rank-title">
        <h2 class="card__title" id="rank-title">Gasto por Categoría</h2>

        <p class="empty-state" *ngIf="!expenseShares().length">Aún no hay gastos este mes para analizar.</p>

        <ul class="rank-list" *ngIf="expenseShares().length">
          <li class="rank-item" *ngFor="let share of expenseShares()">
            <div class="rank-item__header">
              <span class="rank-item__name">{{ share.name }}</span>
              <span class="rank-item__value">{{ share.amount | cop }} · {{ share.percent | number: '1.0-0' }}%</span>
            </div>
            <div class="rank-item__bar">
              <div class="rank-item__fill" [style.width.%]="share.percent" [style.background]="share.color"></div>
            </div>
          </li>
        </ul>
      </section>

      <section class="card insight-card" aria-labelledby="insight-title">
        <h2 class="card__title" id="insight-title">Insights del mes</h2>

        <p class="empty-state" *ngIf="!insights().length">Registra movimientos para ver tus insights.</p>

        <div class="insight-item" *ngFor="let insight of insights()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--teal)" aria-hidden="true">
            <path d="M9.00011 5.99976V9M9.00011 12.0002H9.00761M16.5007 9C16.5007 13.1425 13.1426 16.5006 9.00011 16.5006C4.85764 16.5006 1.49951 13.1425 1.49951 9C1.49951 4.85754 4.85764 1.4994 9.00011 1.4994C13.1426 1.4994 16.5007 4.85754 16.5007 9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <p class="insight-item__text">{{ insight }}</p>
        </div>
      </section>

    </div>
  </main>
</div>

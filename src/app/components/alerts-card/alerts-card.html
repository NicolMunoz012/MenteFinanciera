<article class="card alerts-card">
  <div class="alerts-card__header">
    <h2 class="alerts-card__title">Alertas Gasto-Hormiga</h2>
    <a class="alerts-card__link" routerLink="/alertas">Ver todas</a>
  </div>

  <p class="empty-state" *ngIf="!alerts.length">No tienes alertas por ahora.</p>

  <ul class="alert-list" *ngIf="alerts.length">
    <li class="alert-item" *ngFor="let alert of alerts">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4.5 9L7.5 6L4.5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="alert-item__body">
        <p class="alert-item__text">{{ alert.text }}</p>
        <p class="alert-item__time">{{ alert.tag }}</p>
      </div>
    </li>
  </ul>
</article>
